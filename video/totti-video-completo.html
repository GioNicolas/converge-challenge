:root{
  --papel:#f5f2ec; --sup:#ffffff; --sup2:#ede8e0; --vidro:#fbf9f4; --borda:rgba(28,24,18,.10);
  --tinta:#1c1812; --suave:#5c5448; --pedra:#8a8277; --creme:#f5f0e8;
  --sombra:0 1px 2px rgba(28,24,18,.06),0 14px 30px -18px rgba(28,24,18,.25);
  --flut:0 2px 6px rgba(28,24,18,.08),0 24px 50px -24px rgba(28,24,18,.4);
  --T:&quot;Fraunces&quot;,Georgia,serif; --I:&quot;Inter&quot;,system-ui,sans-serif; --M:&quot;JetBrains Mono&quot;,ui-monospace,monospace;
  --H:&quot;Virgil&quot;,&quot;Kalam&quot;,cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--papel)}
body{font-family:var(--I);color:var(--tinta);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--papel);transform-origin:0 0}
.abs{position:absolute}
.rotulo{font:600 13px/1 var(--I);letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.serif{font-family:var(--T);font-weight:500;letter-spacing:-.025em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--tinta);color:#f5f0e8;border-radius:999px;padding:15px 26px;font:600 18px/1 var(--I);white-space:nowrap}
.ok{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--tinta);color:#f5f0e8}

/* ---------- vaga publicada (fim da parte 1) ---------- */
#pub{left:580px;top:140px;width:760px;background:var(--sup);border-radius:20px;box-shadow:var(--sombra);padding:34px 36px 30px}
#pub .cab{display:flex;gap:20px;align-items:center}
#pub .cab .ok{width:56px;height:56px;font-size:26px}
#pub h2{font-size:40px;line-height:1.05;margin:8px 0 6px}
#pub .sub{font-size:18px;color:var(--suave)}
#lista{margin-top:24px;display:flex;flex-direction:column;gap:6px}

const lerp = (a, b, k) =&gt; a + (b - a) * k;
const prog = (t, a, b) =&gt; clamp((t - a) / (b - a));

// ---------- curvas do produto ----------
function bez(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (u) =&gt; ((ax * u + bx) * u + cx) * u, sy = (u) =&gt; ((ay * u + by) * u + cy) * u;
  return (x) =&gt; {
    if (x &lt;= 0) return 0; if (x &gt;= 1) return 1;
    let lo = 0, hi = 1, u = x;
    for (let i = 0; i &lt; 40; i++) { const v = sx(u); if (Math.abs(v - x) &lt; 1e-6) break; if (v &lt; x) lo = u; else hi = u; u = (lo + hi) / 2; }
    return sy(u);
  };
}

function montarTimeline() {

function montarCursores() {

// ====================================================================
// RENDER(t): tudo que é calculado a partir do tempo

const narrFrase = $(&quot;#narrFrase&quot;), narrRot = $(&quot;#narrRot&quot;);
let narrAtual = -1, narrPalavras = [];
function narrar(t) {
  let i = -1; for (let j = 0; j &lt; NARR.length; j++) if (t &gt;= NARR[j].a - 0.01) i = j;
  const n = NARR[i];
  const vis = n ? 1 - prog(t, n.b, n.b + 0.4) : 0;
  $(&quot;#narr&quot;).style.opacity = vis;
  if (!n || vis &lt;= 0) return;
  if (narrAtual !== i) {
    narrAtual = i; let it = false;
    narrFrase.innerHTML = n.txt.split(&quot; &quot;).map((w) =&gt; { const ab = w.startsWith(&quot;*&quot;), fe = w.endsWith(&quot;*&quot;); if (ab) it = true; const s = w.replace(/\*/g, &quot;&quot;); const h = `&lt;span class=&quot;w&quot;&gt;&lt;span&gt;${it ? `&lt;em&gt;${s}&lt;/em&gt;` : s}&lt;/span&gt;&lt;/span&gt;`; if (fe) it = false; return h; }).join(&quot; &quot;);
    narrPalavras = [...narrFrase.querySelectorAll(&quot;.w &gt; span&quot;)];
  }
  narrRot.style.opacity = E.saida(prog(t, n.a, n.a + 0.4));
  narrPalavras.forEach((el, k) =&gt; { const p = E.saida(prog(t, n.a + 0.1 + k * 0.06, n.a + 0.6 + k * 0.06)); el.style.transform = `translateY(${105 * (1 - p)}%)`; el.style.opacity = 0.2 + 0.8 * p; });
}

const capTxt = $(&quot;#capTxt&quot;), cap = $(&quot;#cap&quot;);
function legenda(t) {
  let f = null; for (const x of FALAS) if (t &gt;= x.a - 0.15) f = x;
  if (!f) { cap.style.opacity = 0; return; }
  const ent = E.saida(prog(t, f.a - 0.15, f.a + 0.1)), fimF = f.quem ? 0.1 : 0.7, sai = 1 - prog(t, f.b + fimF, f.b + fimF + 0.3);
  const op = ent * sai; cap.style.opacity = op;
  cap.style.transform = `translateX(-50%) translateY(${6 * (1 - ent)}px) scale(${0.97 + 0.03 * ent})`;
  if (op &lt;= 0) return;
  const total = f.blocos.reduce((s, b) =&gt; s + b.length, 0);
  const r = prog(t, f.a, f.b) * total;
  let ini = 0, bi = 0; for (; bi &lt; f.blocos.length - 1; bi++) { if (r &lt; ini + f.blocos[bi].length) break; ini += f.blocos[bi].length; }
  const bloco = f.blocos[bi], n = Math.round(clamp(r - ini, 0, bloco.length));

  $(&quot;#barras&quot;).style.display = f.quem ? &quot;none&quot; : &quot;&quot;;
  capTxt.innerHTML = `&lt;b&gt;${bloco.slice(0, n)}&lt;/b&gt;${bloco.slice(n)}`;
  const on = pesoFala(t);

    const per = 3.6 + i * 0.3, s = 0.3 + 0.55 * (0.5 + 0.5 * Math.sin((2 * Math.PI * t) / per + i * 1.3));

// rastro
const LINHAS = $(&quot;#linhas&quot;);
RASTRO.forEach((r) =&gt; { r.el = document.createElement(&quot;div&quot;); r.el.className = &quot;ln&quot;; LINHAS.appendChild(r.el); });
const criadoras = RASTRO.filter((r) =&gt; !r.substitui);
function rastro(t) {
  const H = 26;
  for (const r of RASTRO) {
    const dona = r.substitui ? RASTRO.find((x) =&gt; x.id === r.substitui) : r;
    const ativo = t &gt;= r.a;
    if (!ativo) { r.el.style.opacity = 0; continue; }
    // quantas linhas novas entraram depois desta (cada entrada sobe tudo, 480 ms)
    let k = 0; for (const c of criadoras) if (c.a &gt; dona.a) k += E.suave(prog(t, c.a, c.a + 0.48));
    const entrada = r.a &gt; -1 ? E.saida(prog(t, r.a, r.a + 0.3)) : 1;
    let op = (1 - clamp(k - 3)) * entrada;
    if (r.troca !== undefined) op *= 1 - prog(t, r.troca, r.troca + 0.15);
    r.el.style.opacity = op;
    r.el.style.transform = `translateY(${(3 - k) * H + 6 * (1 - entrada)}px)`;
    if (op &lt;= 0) continue;
    const s = typeof r.s === &quot;function&quot; ? r.s(t) : r.s;
    const feito = r.fim !== undefined &amp;&amp; t &gt;= r.fim;
    if (feito) {
      const kk = prog(t, r.fim, r.fim + 0.24);
      r.el.style.color = `rgb(${rgb([lerp(28, 138, kk), lerp(24, 130, kk), lerp(18, 119, kk)])})`;
      r.el.innerHTML = `&lt;span style=&quot;display:inline-block;transform:scale(${lerp(.6, 1, E.mola(prog(t, r.fim, r.fim + .3)))})&quot;&gt;✓&lt;/span&gt; ${s}`;
    } else {
      const n = Math.min(s.length, Math.floor((t - r.a) * 35));
      const pisca = ((t - r.a) % 1) &lt; 0.5;
      r.el.style.color = &quot;#1c1812&quot;;
      r.el.innerHTML = `${s.slice(0, n)}&lt;span class=&quot;bk&quot;&gt;${pisca ? &quot;▍&quot; : &quot;&quot;}&lt;/span&gt;`;
    }
  }
}

function quadro(t) {
  for (const d of TX) { const n = Math.round(prog(t, d.a, d.b) * d.s.length); d.el.textContent = d.s.slice(0, n); }
  for (const f of FORMAS) {
    tracar(f, easeTraco(prog(t, f.a, f.b)));
    if (f.tx) { const n = Math.round(prog(t, f.ra, f.rb) * f.rot.length); f.tx.textContent = f.rot.slice(0, n); }
  }
  tracar(CIRCULO, easeTraco(prog(t, CIRCULO.a, CIRCULO.b)));

  let ativa = &quot;selecao&quot;;
  for (const f of FORMAS) if (t &gt;= f.a - 0.15 &amp;&amp; t &lt; f.b) ativa = f.k === &quot;ret&quot; ? &quot;retangulo&quot; : f.k === &quot;eli&quot; ? &quot;elipse&quot; : &quot;seta&quot;;
  for (const k in TB) TB[k].classList.toggle(&quot;on&quot;, k === ativa);
  // cronômetro: o tempo da entrevista, comprimido no vídeo
  const marcas = [[0, 12], [6, 12], [15.5, 40], [21.5, 250], [28.6, 362], [30, 362]];
  let seg = 12; for (let i = 1; i &lt; marcas.length; i++) if (t &lt;= marcas[i][0]) { seg = lerp(marcas[i - 1][1], marcas[i][1], prog(t, marcas[i - 1][0], marcas[i][0])); break; }

}

// janelas em que o Totti fala: só nelas o cursor dele fica visível
const JANELAS_TOTTI = [[6.0, 11.2], [13.0, 16.0], [21.2, 26.4]];
const tcur = $(&quot;#tcur&quot;), hcur = $(&quot;#hcur&quot;);
function cursores(t) {
  const [hx, hy] = HC.pos(t);
  const hop = prog(t, 1.0, 1.25) * (1 - prog(t, 28.75, 28.95));
  // clique: o cursor encolhe um pouco
  let aperto = 1; for (const c of [2.2, 3.3, 5.4, 28.6]) aperto = Math.min(aperto, 1 - 0.12 * Math.sin(Math.PI * prog(t, c, c + 0.2)));
  hcur.style.opacity = hop; hcur.style.transform = `translate(${hx - 3.5}px,${hy - 2.3}px) scale(${aperto})`;
  const [tx, ty] = TC.pos(t);
  // o cursor do Totti só aparece quando ele fala (e escreve/marca no quadro)
  let top = 0, cai = 0;
  for (const [a, b] of JANELAS_TOTTI) { const ent = E.saida(prog(t, a, a + 0.25)), sai = 1 - prog(t, b, b + 0.3); if (ent * sai &gt; top) { top = ent * sai; cai = 6 * (1 - ent); } }
  tcur.style.opacity = top; tcur.style.transform = `translate(${tx - 2.4}px,${ty - 2.4 + cai}px)`;
}

function render(t) {
  desenharAneis(t); narrar(t); legenda(t); rastro(t); quadro(t); cursores(t);
}

/* ── câmera e mundo ── */

#world{position:absolute;left:0;top:0;width:1920px;height:2600px}

/* ── painel da vaga ── */
#vagaHead{position:absolute;left:540px;top:190px;width:1100px}
.crumb{font:400 15px/22px Inter;color:var(--suave)}
#vagaHead .rot{margin-top:22px}
.vtitle{margin:12px 0 0;font:500 52px/1.08 Fraunces,serif;letter-spacing:-.025em;white-space:nowrap}
.vsub{margin-top:10px;font:400 18px/26px Inter;color:var(--suave)}
.tabs{margin-top:24px;display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--sup2)}
.tab{position:relative;display:inline-block;padding:10px 18px;border-radius:999px;font:500 15px/18px Inter;color:var(--suave);white-space:nowrap}
.tab.on{background:var(--sup);color:var(--tinta);box-shadow:0 1px 2px rgba(28,24,18,.08),0 6px 14px -8px rgba(28,24,18,.3)}
#tabBadge{position:absolute;top:-8px;right:-6px;font:600 11px/1 Inter;color:var(--claro);background:var(--tinta);padding:4px 7px;border-radius:999px}

#list{position:absolute;left:540px;top:470px;width:1100px;padding:8px;background:var(--sup);border-radius:20px;box-shadow:var(--sh-card);z-index:1}
.row{display:flex;align-items:center;gap:24px;padding:16px;border-radius:14px}
.thumbSlot{width:144px;height:90px;border-radius:10px;flex:none}
.ghost{width:144px;height:90px;border-radius:10px;flex:none;background:var(--sup2)}
.who{flex:1;min-width:0}
.nm{font:600 19px/26px Inter}
.mt{margin-top:2px;font:400 15px/22px Inter;color:var(--suave)}
.row.dim .nm{color:var(--suave);font-weight:500}
.status{position:relative;flex:none;width:240px;height:36px}
#stNow{position:absolute;right:0;top:0;height:36px;display:flex;align-items:center;gap:8px;font:500 15px/1 Inter;color:var(--suave)}
#stNow canvas{display:block}
#stPill{position:absolute;right:0;top:2px;transform-origin:100% 50%}
.dimSt{position:absolute;right:0;top:0;height:36px;display:flex;align-items:center;font:500 15px/1 Inter;color:var(--pedra)}
.listSub{padding:20px 16px 4px}

#thumb{position:absolute;left:0;top:0;width:560px;height:350px;background:var(--sup);border-radius:20px;box-shadow:var(--sh-card);
  transform-origin:0 0;overflow:hidden;z-index:3}
#thumb svg{display:block;width:560px;height:350px}
#expander{position:absolute;left:0;top:0;z-index:2}

/* ── relatório ── */
#report{position:absolute;left:540px;top:470px;width:1100px;z-index:4}
.back{font:400 16px/24px Inter;color:var(--suave)}
#rLabel{margin-top:18px}
.rTitle{margin:14px 0 0;font:500 76px/1 Fraunces,serif;letter-spacing:-.025em}
.rTitle .soft{color:var(--suave)}
.rPara{margin:22px 0 0;max-width:1060px;font:400 21px/1.45 Inter}
.selos{margin-top:22px;display:flex;gap:10px}
.selo{display:inline-flex;align-items:center;height:36px;padding:0 15px;border-radius:999px;background:var(--sup);border:1px solid var(--borda);font:500 15px/1 Inter;white-space:nowrap}
#notesHead{margin-top:34px;font:600 18px/24px Inter}
#notesHead span{font-weight:400;color:var(--suave)}
#notes{margin-top:12px;background:var(--sup);border-radius:20px;box-shadow:var(--sh-card);padding:4px 0}
.nrow{display:grid;grid-template-columns:1fr auto 48px 112px;align-items:center;column-gap:24px;height:58px;padding:0 24px}
.nrow.sep{border-top:1px solid var(--borda)}
.nname{font:500 18px/1 Inter}
.segs{display:flex;gap:6px}
.segs i{position:relative;display:block;width:40px;height:10px;border-radius:999px;background:var(--sup2);overflow:hidden}
.segs b{position:absolute;left:0;top:0;width:100%;height:100%;background:var(--tinta);transform-origin:0 50%}
.nval{font:600 17px/1 Inter;text-align:right}
.nlink{font:500 15px/1 Inter;color:var(--suave);text-align:right;white-space:nowrap}
#learned{overflow:hidden}
#learnedIn{margin:0 24px 14px;padding:14px 18px;background:var(--sup2);border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.lt{font:600 14px/20px Inter}
.lv{margin-top:2px;font:400 17px/24px Inter}
.ll{font:500 14px/1 Inter;color:var(--suave);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
#adapt{margin-top:22px;background:var(--sup);border-radius:20px;box-shadow:var(--sh-card);padding:20px 24px}
.ahead{display:flex;align-items:center;gap:20px}
.atitle{font:600 18px/1 Inter}
.atext{margin-top:12px;font:400 17px/1.5 Inter;color:var(--suave)}

/* ── decisão ── */
#decision{position:relative;margin-top:30px;width:700px;background:var(--sup2);border-radius:22px}
.dl{position:absolute;left:0;top:0;width:100%;padding:28px}
.dq{margin-top:12px;font:500 34px/1.15 Fraunces,serif;letter-spacing:-.025em}
.dt{margin-top:10px;font:400 17px/1.5 Inter;color:var(--suave)}
.btns{margin-top:22px;display:flex;gap:12px}
.btn{display:inline-grid;align-items:center;justify-items:center;height:48px;padding:0 22px;border-radius:999px;font:600 16px/1 Inter;white-space:nowrap}
.btn &gt; span{grid-area:1/1;display:inline-flex;align-items:center;gap:9px}
.btn canvas{display:block}
.btn.ink{background:var(--tinta);color:var(--claro)}
.btn.line{box-shadow:inset 0 0 0 1px rgba(28,24,18,.22);color:var(--tinta)}
#field{position:relative;margin-top:16px;height:52px;background:var(--sup);border:1px solid rgba(28,24,18,.10);border-radius:12px;
  padding:0 16px;display:flex;align-items:center;font:400 17px/1 Inter;white-space:nowrap}
#fieldPh{position:absolute;left:16px;top:0;height:50px;display:flex;align-items:center;color:var(--pedra)}
#fieldCaret{display:inline-block;width:2px;height:22px;background:var(--tinta);margin-left:1px}
.dec-row{display:flex;align-items:center;gap:14px}
.dec-date{font:400 16px/1 Inter;color:var(--suave)}
.dec-title{margin-top:20px;font:600 20px/1.3 Inter}
.dec-text{margin-top:6px;font:400 17px/1.45 Inter;color:var(--suave)}

#flyEnv{position:absolute;left:0;top:0;width:40px;height:40px;z-index:6}
#flyEnv svg{display:block;width:40px;height:40px}
#flyPill{position:absolute;left:0;top:0;z-index:6;display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:999px;
  background:var(--sup);box-shadow:var(--sh-float);font:500 15px/1 Inter;white-space:nowrap}

/* ── camadas do palco ── */
#topfade{position:absolute;left:0;top:0;width:1920px;height:168px;z-index:5;pointer-events:none;
  background:linear-gradient(var(--papel) 0,var(--papel) 128px,rgba(245,242,236,0) 168px)}
#fin{position:absolute;left:0;top:0;width:700px;padding:28px;border-radius:22px;background:var(--sup2);visibility:hidden;z-index:6;
  transform:translate(-50%,-50%)}
#overlay{position:absolute;left:0;top:0;width:1920px;height:1080px;background:rgba(28,24,18,.25);z-index:7}

/* ── modal da prova ── */
#modal{position:absolute;left:530px;top:170px;width:1120px;height:780px;background:var(--sup);border-radius:20px;box-shadow:var(--sh-float);
  padding:34px 40px;z-index:8}
.mhead{display:flex;justify-content:space-between;gap:30px}
.mmeta{font:500 14px/1 Inter;color:var(--suave)}
.mono{font-family:&#x27;JetBrains Mono&#x27;,monospace}
.mquote{margin-top:12px;max-width:820px;font:400 22px/1.4 Inter}
.mright{display:flex;align-items:center;gap:16px;flex:none;align-self:flex-start}
.mnav{display:inline-flex;align-items:center;gap:10px;font:500 15px/1 Inter;color:var(--suave)}
.chev{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--borda);color:var(--tinta);font:500 18px/1 Inter}
#mclose{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--borda);font:400 24px/1 Inter;color:var(--tinta)}
.mbody{margin-top:24px;padding-top:24px;border-top:1px solid var(--borda);display:grid;grid-template-columns:540px 1fr;column-gap:36px}
.mboard{margin-top:12px;width:540px;height:338px;border:1px solid var(--borda);border-radius:14px;overflow:hidden;background:#fff}
.mboard svg{display:block;width:540px;height:337.5px}
.msg{margin-top:14px;padding:14px 16px;border-radius:14px}
.msg.hi{background:var(--sup2)}
.mwho{font:600 13px/1 Inter;color:var(--suave)}
.mtxt{margin-top:8px;font:400 17px/1.5 Inter}
.mtxt.soft{color:var(--suave)}
.mfoot{position:absolute;left:40px;right:40px;bottom:30px}
.rtrack{position:relative;height:6px;border-radius:999px;background:var(--sup2)}
#rFill{position:absolute;left:0;top:0;height:6px;border-radius:999px;background:rgba(28,24,18,.28)}
.rtick{position:absolute;top:-5px;width:2px;height:16px;margin-left:-1px;border-radius:2px;background:var(--pedra)}
.rtick.k{background:var(--tinta)}
#rMarker{position:absolute;top:3px;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--tinta);
  box-shadow:0 0 0 3px #fff,0 2px 6px rgba(28,24,18,.35)}
#rMarkerT{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font:500 13px/1 &#x27;JetBrains Mono&#x27;,monospace;color:var(--tinta);white-space:nowrap}
.rlabels{display:flex;justify-content:space-between;margin-top:14px;font:400 12px/1 &#x27;JetBrains Mono&#x27;,monospace;color:var(--suave)}

/* ── narração ── */
#narr{position:absolute;left:56px;top:48px;width:900px;height:200px;pointer-events:none;z-index:9}
.n-lab{position:absolute;left:0;top:0;opacity:0}
.n-ph{position:absolute;left:0;top:26px;width:900px;font:500 40px/1.15 Fraunces,serif;letter-spacing:-.025em}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .06em .14em 0;margin:0 -.06em -.14em 0}
.wi{display:inline-block}
.wi.it{font-style:italic}

/* ── rastro ── */
#rastro{position:absolute;left:40px;top:876px;width:460px;padding:18px 22px;background:var(--vidro);border:1px solid var(--borda);
  border-radius:20px;box-shadow:var(--sh-float);overflow:hidden;z-index:9}
.rs-head{display:flex;align-items:center;gap:9px;height:18px}
.rs-head canvas{display:block}
#rsLines{position:relative;margin-top:12px;height:96px;overflow:hidden}
.rl{position:absolute;left:0;right:0;bottom:0;padding-left:2ch;font:400 15px/24px &#x27;JetBrains Mono&#x27;,monospace;white-space:normal}
.rl .ck{position:absolute;left:0;top:0;width:2ch;line-height:24px;transform-origin:30% 55%}
.rl.hum{color:var(--suave)}
.rl .rest{color:transparent}
.cur{display:inline-block;width:.42em;height:1.08em;background:var(--tinta);vertical-align:-.2em;margin-left:1px}

/* ── cursor humano ── */
#hcur{position:absolute;left:0;top:0;width:26px;height:30px;opacity:0;z-index:11;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.3))}
#hcur svg{display:block}
#ripple{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(28,24,18,.4);opacity:0;z-index:10}
&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;stage&quot;&gt;

  &lt;div id=&quot;cam&quot;&gt;&lt;div id=&quot;world&quot;&gt;

    &lt;!-- Painel da vaga --&gt;
    &lt;div id=&quot;vagaHead&quot;&gt;
      &lt;div class=&quot;crumb&quot;&gt;Todas as vagas ›&lt;/div&gt;
      &lt;div class=&quot;rot&quot;&gt;ENGENHARIA · SÊNIOR&lt;/div&gt;
      &lt;div class=&quot;vtitle&quot;&gt;Desenvolvedor(a) Backend Sênior — Links&lt;/div&gt;
      &lt;div class=&quot;vsub&quot;&gt;10 inscritos · 1 entrevista feita&lt;/div&gt;
      &lt;div class=&quot;tabs&quot;&gt;&lt;span class=&quot;tab on&quot;&gt;Para decidir&lt;/span&gt;&lt;span class=&quot;tab&quot;&gt;Candidatos&lt;/span&gt;&lt;span class=&quot;tab&quot;&gt;Plano da entrevista&lt;/span&gt;&lt;span class=&quot;tab&quot; id=&quot;tabAprendeu&quot;&gt;O que o Totti aprendeu&lt;span id=&quot;tabBadge&quot;&gt;+1&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div id=&quot;list&quot;&gt;
      &lt;div class=&quot;row&quot; id=&quot;rowGabriel&quot;&gt;
        &lt;div class=&quot;thumbSlot&quot; id=&quot;thumbSlot&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;who&quot;&gt;&lt;div class=&quot;nm&quot; id=&quot;rowName&quot;&gt;Gabriel Moreira&lt;/div&gt;&lt;div class=&quot;mt&quot;&gt;System design · hoje, 10:15&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;status&quot;&gt;
          &lt;span id=&quot;stNow&quot;&gt;&lt;canvas id=&quot;cvRow&quot;&gt;&lt;/canvas&gt;Fazendo agora&lt;/span&gt;
          &lt;span id=&quot;stPill&quot; class=&quot;pill-ink&quot;&gt;Avançar · &lt;span id=&quot;stScore&quot;&gt;0,0&lt;/span&gt;/4&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;rot listSub&quot;&gt;AGUARDANDO ENTREVISTA · 9&lt;/div&gt;
      &lt;div class=&quot;row dim&quot;&gt;
        &lt;div class=&quot;ghost&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;who&quot;&gt;&lt;div class=&quot;nm&quot;&gt;Marina Costa&lt;/div&gt;&lt;div class=&quot;mt&quot;&gt;System design · amanhã, 09:30&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;status&quot;&gt;&lt;span class=&quot;dimSt&quot;&gt;Convite aceito&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;row dim&quot;&gt;
        &lt;div class=&quot;ghost&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;who&quot;&gt;&lt;div class=&quot;nm&quot;&gt;Rafael Lima&lt;/div&gt;&lt;div class=&quot;mt&quot;&gt;System design · convite enviado hoje&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;status&quot;&gt;&lt;span class=&quot;dimSt&quot;&gt;Aguardando resposta&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div id=&quot;expander&quot;&gt;&lt;/div&gt;

    &lt;!-- Relatório --&gt;
    &lt;div id=&quot;report&quot;&gt;
      &lt;div class=&quot;back&quot; id=&quot;rBack&quot;&gt;← Voltar aos resultados&lt;/div&gt;
      &lt;div class=&quot;rot&quot; id=&quot;rLabel&quot;&gt;DESENVOLVEDOR(A) BACKEND SÊNIOR — LINKS · GABRIEL MOREIRA&lt;/div&gt;
      &lt;div class=&quot;rTitle&quot; id=&quot;rTitle&quot;&gt;Avançar · &lt;span id=&quot;rScore&quot;&gt;0,0&lt;/span&gt;&lt;span class=&quot;soft&quot;&gt;/4&lt;/span&gt;&lt;/div&gt;
      &lt;p class=&quot;rPara&quot; id=&quot;rPara&quot;&gt;Partiu dos requisitos antes de desenhar, separou leitura e escrita com cache na frente e, quando o volume cresceu dez vezes, apontou o banco como gargalo e propôs réplicas de leitura. Faltou falar de como gerar o código curto sem colisão em escala.&lt;/p&gt;
      &lt;div class=&quot;selos&quot;&gt;&lt;span class=&quot;selo&quot;&gt;6 min de entrevista&lt;/span&gt;&lt;span class=&quot;selo&quot;&gt;1 dúvida esclarecida&lt;/span&gt;&lt;span class=&quot;selo&quot;&gt;5 peças · 4 setas&lt;/span&gt;&lt;span class=&quot;selo&quot;&gt;1 mudança respondida&lt;/span&gt;&lt;/div&gt;
      &lt;div id=&quot;notesHead&quot;&gt;Notas &lt;span&gt;· clique para ver as provas&lt;/span&gt;&lt;/div&gt;
      &lt;div id=&quot;notes&quot;&gt;
        &lt;div class=&quot;nrow&quot; data-score=&quot;4&quot;&gt;&lt;div class=&quot;nname&quot;&gt;Entendimento do problema e requisitos&lt;/div&gt;&lt;div class=&quot;segs&quot;&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;nval&quot;&gt;4/4&lt;/div&gt;&lt;div class=&quot;nlink&quot;&gt;2 provas ›&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;nrow sep&quot; data-score=&quot;3&quot;&gt;&lt;div class=&quot;nname&quot;&gt;Componentes e fluxo&lt;/div&gt;&lt;div class=&quot;segs&quot;&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;nval&quot;&gt;3/4&lt;/div&gt;&lt;div class=&quot;nlink&quot;&gt;2 provas ›&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;nrow sep&quot; data-score=&quot;3&quot;&gt;&lt;div class=&quot;nname&quot;&gt;Dados e consistência&lt;/div&gt;&lt;div class=&quot;segs&quot;&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;nval&quot;&gt;3/4&lt;/div&gt;&lt;div class=&quot;nlink&quot;&gt;1 prova ›&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;nrow sep&quot; data-score=&quot;3&quot;&gt;&lt;div class=&quot;nname&quot;&gt;Escala&lt;/div&gt;&lt;div class=&quot;segs&quot;&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;nval&quot;&gt;3/4&lt;/div&gt;&lt;div class=&quot;nlink&quot; id=&quot;linkEscala&quot;&gt;2 provas ›&lt;/div&gt;&lt;/div&gt;
        &lt;div id=&quot;learned&quot;&gt;&lt;div id=&quot;learnedIn&quot;&gt;
          &lt;div&gt;&lt;div class=&quot;lt&quot;&gt;Critério aprendido com o time&lt;/div&gt;&lt;div class=&quot;lv&quot;&gt;↑ Valoriza quem explica o custo da solução&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;ll&quot;&gt;Ver o que o Totti aprendeu&lt;/div&gt;
        &lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;nrow sep&quot; data-score=&quot;4&quot;&gt;&lt;div class=&quot;nname&quot;&gt;Comunicação&lt;/div&gt;&lt;div class=&quot;segs&quot;&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;nval&quot;&gt;4/4&lt;/div&gt;&lt;div class=&quot;nlink&quot;&gt;2 provas ›&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div id=&quot;adapt&quot;&gt;
        &lt;div class=&quot;ahead&quot;&gt;&lt;div class=&quot;atitle&quot;&gt;Como se adaptou&lt;/div&gt;&lt;div class=&quot;segs&quot; id=&quot;adaptSegs&quot;&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;i&gt;&lt;b&gt;&lt;/b&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;nval&quot; id=&quot;adaptVal&quot;&gt;3/4&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;atext&quot;&gt;Depois da mudança: 2 falas e 1 versão nova do desenho. Esta nota fica fora da nota geral.&lt;/div&gt;
      &lt;/div&gt;
      &lt;div id=&quot;decision&quot;&gt;
        &lt;div class=&quot;dl&quot; id=&quot;layQ&quot;&gt;
          &lt;div class=&quot;rot&quot;&gt;DECISÃO FINAL&lt;/div&gt;
          &lt;div class=&quot;dq&quot;&gt;Gabriel Moreira avança no processo?&lt;/div&gt;
          &lt;div class=&quot;dt&quot;&gt;Você decide; o Totti só recomenda. O candidato recebe o retorno por e-mail e a decisão vira critério na Memória da Squad.&lt;/div&gt;
          &lt;div class=&quot;btns&quot;&gt;&lt;span class=&quot;btn ink&quot; id=&quot;btnAvancar&quot;&gt;&lt;span&gt;Avançar candidato&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;btn line&quot;&gt;&lt;span&gt;Não avançar&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;dl&quot; id=&quot;layC&quot;&gt;

/* ── câmera (função pura do tempo) ── */
let CAM=[];
function camY(t){
  let y=0;
  for(const [t0,t1,to,ease] of CAM){ if(t&lt;=t0) break; y=lerp(y,to,ease(clamp((t-t0)/(t1-t0)))); }
  return y;
}

/* ── cursor humano ── */
let CUR=null;
const W=(r,dx=0,dy=0,useCx=true)=&gt;tt=&gt;[(useCx?r.cx:r.x)+dx, r.cy+dy+camY(tt)];
const Sx=(x,y)=&gt;()=&gt;[x,y];
function cursorAt(t){
  const segs=CUR.segs; let k=-1;
  for(let i=0;i&lt;segs.length;i++) if(t&gt;=segs[i].t0) k=i;
  if(k&lt;0) return CUR.start;
  const s=segs[k], from=k===0?CUR.start:segs[k-1].b(segs[k-1].t1);
  if(t&gt;=s.t1||s.t1&lt;=s.t0) return s.b(s.t1);
  const p=E.suave((t-s.t0)/(s.t1-s.t0)), to=s.b(t);
  const arc=Math.sin(Math.PI*p)*-18;
  return [lerp(from[0],to[0],p)+arc*.4, lerp(from[1],to[1],p)+arc];
}
function opAt(keys,t){
  if(t&lt;=keys[0][0]) return keys[0][1];
  for(let i=1;i&lt;keys.length;i++){ if(t&lt;=keys[i][0]){const [a,va]=keys[i-1],[b,vb]=keys[i];return lerp(va,vb,(t-a)/(b-a));} }
  return keys[keys.length-1][1];
}
const hcur=$(&#x27;#hcur&#x27;), ripple=$(&#x27;#ripple&#x27;);
function renderCursor(t){
  const [x,y]=cursorAt(t), op=opAt(CUR.op,t);
  let press=0, rp=-1;
  for(const c of CUR.clicks){ if(t&gt;=c&amp;&amp;t&lt;c+.2) press=Math.sin(Math.PI*(t-c)/.2); if(t&gt;=c&amp;&amp;t&lt;c+.45) rp=(t-c)/.45; }
  hcur.style.opacity=op.toFixed(4);
  hcur.style.transform=`translate(${(x-2).toFixed(2)}px,${(y-1.5).toFixed(2)}px) scale(${(1-.1*press).toFixed(4)})`;
  if(rp&gt;=0&amp;&amp;op&gt;0.01){
    const q=E.saida(rp);
    ripple.style.opacity=(.9*(1-rp)).toFixed(4);
    ripple.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${lerp(.3,1,q).toFixed(4)})`;
  } else ripple.style.opacity=0;
}

let cur=0, READY=false;
function seek(t){
  t=clamp(+t||0,0,DUR); cur=t;
  if(!READY) return;
  tl.seek(t,true);
  renderPieces(t);
  renderRastro(t);
  renderCursor(t);
  drawRing(ringRastro,t);
  if(t&lt;3.3) drawRing(ringRow,t);
  if(t&gt;=23.3&amp;&amp;t&lt;24.5) drawRing(ringBtn,t);
}

window.duration=DUR;

&lt;script&gt;
(function(){
&#x27;use strict&#x27;;
const DUR = 30;
const $ = s =&gt; document.querySelector(s);
const $$ = s =&gt; Array.from(document.querySelectorAll(s));

/* ── curvas do produto ── */
function bez(x1,y1,x2,y2){
  const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const sx=t=&gt;((ax*t+bx)*t+cx)*t, sy=t=&gt;((ay*t+by)*t+cy)*t, dx=t=&gt;(3*ax*t+2*bx)*t+cx;
  return p=&gt;{
    if(p&lt;=0) return 0; if(p&gt;=1) return 1;
    let t=p;
    for(let i=0;i&lt;8;i++){const x=sx(t)-p, d=dx(t); if(Math.abs(x)&lt;1e-7||Math.abs(d)&lt;1e-6) break; t-=x/d;}
    if(!(t&gt;=0&amp;&amp;t&lt;=1)||Math.abs(sx(t)-p)&gt;1e-5){let lo=0,hi=1;t=p;for(let i=0;i&lt;40;i++){if(sx(t)&lt;p)lo=t;else hi=t;t=(lo+hi)/2;}}
    return sy(t);
  };
}
const E={suave:bez(.32,.72,0,1),saida:bez(.16,1,.3,1),viagem:bez(.65,0,.35,1),mola:bez(.34,1.56,.64,1)};
const clamp=(x,a=0,b=1)=&gt;Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=&gt;a+(b-a)*p;
const prog=(t,s,d,e=E.suave)=&gt;e(clamp((t-s)/d));
const mix=(c1,c2,p)=&gt;`rgb(${Math.round(lerp(c1[0],c2[0],p))},${Math.round(lerp(c1[1],c2[1],p))},${Math.round(lerp(c1[2],c2[2],p))})`;
const INK=[28,24,18], PEDRA=[138,130,119];
const CHECK=&#x27;&lt;svg class=&quot;ck-i&quot; viewBox=&quot;0 0 14 14&quot;&gt;&lt;path d=&quot;M2.2 7.6 L5.6 10.8 L11.8 3.6&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.9&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;&#x27;;

/* ── o anel de voz (algoritmo do produto, versão papel) ── */
const DPR=2;
const ST={ouvindo:{v:.28,a:.55,arc:0}, pensando:{v:.45,a:.60,arc:1}};
function stateAt(sched,t){
  let c={...ST[sched[0][1]]};
  for(let k=1;k&lt;sched.length;k++){
    const [ti,n]=sched[k]; if(t&lt;=ti) break;
    const p=clamp((t-ti)/.25), s=p*p*(3-2*p), g=ST[n];
    c={v:lerp(c.v,g.v,s),a:lerp(c.a,g.a,s),arc:lerp(c.arc,g.arc,s)};
  }
  return c;
}
function mkPhase(sched,off){
  const R=240,N=DUR*R+2,ph=new Float64Array(N); ph[0]=off;
  for(let i=1;i&lt;N;i++) ph[i]=ph[i-1]+stateAt(sched,(i-.5)/R).v/R;
  return t=&gt;{const x=clamp(t,0,DUR)*R,i=Math.floor(x),f=x-i;return ph[i]+(ph[Math.min(i+1,N-1)]-ph[i])*f;};
}
function ondulacao(a,fase,desl){
  return Math.sin(4*a+fase*3.1+desl)*0.55+Math.sin(7*a-fase*2.3+desl*2)*0.30+Math.sin(11*a+fase*4.2)*0.15;
}
function mkRing(cv,css,sched,off){
  cv.width=cv.height=css*DPR; cv.style.width=cv.style.height=css+&#x27;px&#x27;;
  return {ctx:cv.getContext(&#x27;2d&#x27;),css,sched,phase:mkPhase(sched,off)};
}
function ringPath(ctx,fase,desl,esc,e,a0,a1,n){
  ctx.beginPath();
  for(let i=0;i&lt;=n;i++){
    const a=a0+(a1-a0)*i/n;
    const r=34*esc*(1+e*0.1)+ondulacao(a,fase,desl)*(1+e*9);
    const x=66+Math.cos(a)*r, y=66+Math.sin(a)*r;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
}
function drawRing(R,t){
  const st=stateAt(R.sched,t), fase=R.phase(t);
  const energia=0.12+0.04*Math.sin(t*1.2), e=energia*st.a;
  const ctx=R.ctx, px=R.css*DPR, S=px/132, u=DPR/S; // u = 1 px css em unidades do desenho
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,px,px);
  ctx.setTransform(S,0,0,S,0,0);
  const ga=0.08+e*0.22, gr=ctx.createRadialGradient(66,66,0,66,66,66);
  gr.addColorStop(0,`rgba(190,182,168,${ga})`); gr.addColorStop(.55,`rgba(190,182,168,${ga*.55})`); gr.addColorStop(1,&#x27;rgba(190,182,168,0)&#x27;);
  ctx.fillStyle=gr; ctx.fillRect(0,0,132,132);
  ctx.shadowColor=&#x27;rgb(190,182,168)&#x27;; ctx.shadowBlur=(10+e*14)*S;
  ctx.lineJoin=&#x27;round&#x27;; ctx.lineCap=&#x27;round&#x27;;
  // anel irmão
  ringPath(ctx,fase,1.7,1.12,e,0,Math.PI*2,180); ctx.closePath();
  ctx.strokeStyle=`rgba(92,84,72,${0.22+e*0.2})`; ctx.lineWidth=Math.max(1,0.7*u); ctx.stroke();
  // anel principal
  ringPath(ctx,fase,0,1,e,0,Math.PI*2,180); ctx.closePath();
  ctx.strokeStyle=&#x27;rgba(92,84,72,.95)&#x27;; ctx.lineWidth=Math.max(1.8,1.1*u); ctx.stroke();
  // arco de &quot;pensando&quot;: 1,1 rad de tinta percorrendo o anel a 1,8 rad/s
  if(st.arc&gt;0.005){
    const a0=1.8*t-Math.PI/2;
    ringPath(ctx,fase,0,1,e,a0,a0+1.1,40);
    ctx.strokeStyle=`rgba(28,24,18,${st.arc})`; ctx.lineWidth=Math.max(3,1.5*u); ctx.stroke();
  }
}
const OUV=[[0,&#x27;ouvindo&#x27;]];
const rings=[
  mkRing($(&#x27;#cvR&#x27;),16,[[0,&#x27;pensando&#x27;],[0.3,&#x27;ouvindo&#x27;],[6.6,&#x27;pensando&#x27;],[8.6,&#x27;ouvindo&#x27;],[13.2,&#x27;pensando&#x27;],[15.0,&#x27;ouvindo&#x27;],[21.2,&#x27;pensando&#x27;],[24.0,&#x27;ouvindo&#x27;]],0.8),
  mkRing($(&#x27;#cvLB&#x27;),20,OUV,2.1),
  mkRing($(&#x27;#cvF&#x27;),220,[[0,&#x27;ouvindo&#x27;],[21.2,&#x27;pensando&#x27;],[24.0,&#x27;ouvindo&#x27;]],3.7),
  mkRing($(&#x27;#cvFB&#x27;),20,OUV,5.3),
];

/* ── rastro ── */
const RL=[
  {tx:&#x27;escreveu o relatório · 9 provas&#x27;,s:-10,d:-9},

const rsLines=$(&#x27;#rsLines&#x27;);
RL.forEach(L=&gt;{
  const el=document.createElement(&#x27;div&#x27;); el.className=&#x27;rl&#x27;+(L.hum?&#x27; hum&#x27;:&#x27;&#x27;);
  el.innerHTML=`&lt;span class=&quot;ck&quot;&gt;${L.hum?&#x27;&#x27;:CHECK}&lt;/span&gt;&lt;span class=&quot;tx&quot;&gt;&lt;/span&gt;&lt;span class=&quot;cur&quot;&gt;&lt;/span&gt;`;
  rsLines.appendChild(el);
  L.el=el; L.ck=el.querySelector(&#x27;.ck&#x27;); L.txEl=el.querySelector(&#x27;.tx&#x27;); L.cur=el.querySelector(&#x27;.cur&#x27;); L.last=null;
});
const SUM=[&#x27;leu a vaga e montou o plano&#x27;,&#x27;conversou por voz com a recrutadora&#x27;,&#x27;enviou 10 convites e agendou&#x27;,
  &#x27;entrevistou por voz, no quadro, ao vivo&#x27;,&#x27;trouxe uma mudança e viu como ele se adapta&#x27;,&#x27;escreveu o scorecard com 9 provas&#x27;,
  &#x27;deu retorno a 10 de 10 candidatos&#x27;,&#x27;aprendeu com a decisão do time&#x27;];
$(&#x27;#rsSum&#x27;).innerHTML=SUM.map(s=&gt;`&lt;div class=&quot;sl&quot;&gt;&lt;span class=&quot;ck&quot;&gt;${CHECK}&lt;/span&gt;${s}&lt;/div&gt;`).join(&#x27;&#x27;)
  +&#x27;&lt;div class=&quot;ssep&quot;&gt;&lt;/div&gt;&lt;div class=&quot;sfoot&quot;&gt;você · colou a vaga · respondeu 1 pergunta · decidiu&lt;/div&gt;&#x27;;

function renderRastro(t){
  const off=prog(t,6.6,.48,E.viagem)+prog(t,13.2,.48,E.viagem);
  for(let i=0;i&lt;RL.length;i++){
    const L=RL[i], y=(i-off)*24;
    let op=1; if(y&lt;0) op=clamp(1+y/24); if(y&gt;72) op=clamp(1-(y-72)/24); if(t&lt;L.s) op=0;
    L.el.style.transform=`translateY(${y.toFixed(3)}px)`; L.el.style.opacity=op.toFixed(4);
    const n=clamp(Math.floor((t-L.s)*35+1e-9),0,L.tx.length), txt=L.tx.slice(0,n);
    if(txt!==L.last){L.txEl.textContent=txt; L.last=txt;}
    const ativa=t&gt;=L.s&amp;&amp;t&lt;L.d;
    L.cur.style.display=ativa?&#x27;inline-block&#x27;:&#x27;none&#x27;;
    L.cur.style.visibility=(t%1)&lt;0.5?&#x27;visible&#x27;:&#x27;hidden&#x27;;
    if(!L.hum){
      const pd=t&gt;=L.d?prog(t,L.d,.24):0;
      L.el.style.color=mix(INK,PEDRA,pd);
      const k=t&gt;=L.d?E.mola(clamp((t-L.d)/.24)):0;
      L.ck.style.transform=`scale(${k.toFixed(4)})`; L.ck.style.opacity=t&gt;=L.d?1:0;
    }
  }
}

/* ── envelope: sai do cartão, faz um arco pela direita e pousa no item novo ── */
const env=$(&#x27;#env&#x27;);
const P=[[1000,580],[1310,500],[1180,160],[730,300]];
function cubic(p){const q=1-p;return [0,1].map(k=&gt;q*q*q*P[0][k]+3*q*q*p*P[1][k]+3*q*p*p*P[2][k]+p*p*p*P[3][k]);}
function renderEnvelope(t){
  if(t&lt;0.5||t&gt;2){env.style.opacity=0;return;}
  const pop=prog(t,.5,.22,E.saida), pf=prog(t,.5,1.0,E.viagem), dis=prog(t,1.5,.4,E.suave);
  const [x,y]=cubic(pf);
  const sc=lerp(.6,1,pop)*lerp(1,.78,pf)*lerp(1,.5,dis), rot=12*Math.sin(Math.PI*pf);
  env.style.opacity=(pop*(1-dis)).toFixed(4);
  env.style.transform=`translate(${(x-20).toFixed(2)}px,${(y-20-8*pop*(1-pf)).toFixed(2)}px) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
  env.style.filter=`drop-shadow(0 6px 10px rgba(28,24,18,${(.22*(1-dis)).toFixed(3)})) blur(${(3*dis).toFixed(2)}px)`;
}

/* ── cursor humano: passa no interruptor da regra nova, sem clicar ── */

<div id="tela" title="Clique para tocar do começo · espaço pausa"></div>
<script>
(() => {
"use strict";
// Quatro partes de 30 s, uma depois da outra: 0–30, 30–60, 60–90, 90–120.
const PARTE = 30, N = 4, DUR = PARTE * N;
const frames = [...document.querySelectorAll("#stage iframe")];
const stage = document.getElementById("stage");
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
}
addEventListener("resize", fit); fit();
const carregou = (f) => new Promise((ok) => { if (f.contentDocument && f.contentDocument.readyState === "complete" && f.contentWindow.seek) ok(); else f.addEventListener("load", () => ok(), { once: true }); });
window.ready = (async () => {
  await Promise.all(frames.map(carregou));
  await Promise.all(frames.map((f) => f.contentWindow.pronto || f.contentWindow.ready));
  return true;
})();
let atual = -1, T = 0;
function seek(t) {
  T = Math.min(DUR, Math.max(0, +t || 0));
  const i = Math.min(N - 1, Math.floor(T / PARTE));
  if (i !== atual) { frames.forEach((f, k) => (f.style.visibility = k === i ? "visible" : "hidden")); atual = i; }
  frames[i].contentWindow.seek(T - i * PARTE);
}
window.seek = seek; window.duration = DUR;
// reprodução em tempo real (desligada com ?parado, usado na gravação)
const parado = /[?&]parado\b/.test(location.search);
let t0 = null, pausa = false, rodada = 0;
function tocar(de = 0) {
  const id = ++rodada; t0 = performance.now() - de * 1000; pausa = false;
  const laco = (now) => { if (id !== rodada || pausa) return; const t = (now - t0) / 1000; seek(t); if (t < DUR) requestAnimationFrame(laco); };
  requestAnimationFrame(laco);
}
window.ready.then(() => { seek(0); if (!parado) tocar(0); });
document.getElementById("tela").addEventListener("click", () => window.ready.then(() => tocar(0)));
addEventListener("keydown", (e) => {
  if (e.code !== "Space") return; e.preventDefault();
  if (pausa) tocar(T); else { pausa = true; rodada++; }
});
})();
</script>
